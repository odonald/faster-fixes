# Fully self-hosted FasterFixes: dashboard + widget API, Postgres (data + job
# queue), a volume for uploaded files, and Mailpit as an SMTP sink for local
# testing.
#
#   cp .env.docker.example .env
#   docker compose up -d --build
#   open http://localhost:3000/login
#
# For a real server replace Mailpit with your SMTP relay (see .env) and put a
# reverse proxy with TLS in front of `web` (port 3000). Files live in the
# `uploads-data` volume by default; STORAGE_PROVIDER=database keeps them in
# Postgres instead, STORAGE_PROVIDER=s3 in an S3-compatible bucket.

name: faster-fixes

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_FF_API_ORIGIN: ${BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_STORAGE_PROVIDER: ${STORAGE_PROVIDER:-filesystem}
        NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL:-/api/assets}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_GITHUB_APP_NAME: ${NEXT_PUBLIC_GITHUB_APP_NAME:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fasterfixes}:${POSTGRES_PASSWORD:-fasterfixes}@postgres:5432/${POSTGRES_DB:-fasterfixes}?schema=public
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-filesystem}
      STORAGE_DIR: /data/uploads
      NEXT_PUBLIC_IS_CLOUD: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fasterfixes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fasterfixes}
      POSTGRES_DB: ${POSTGRES_DB:-fasterfixes}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fasterfixes} -d ${POSTGRES_DB:-fasterfixes}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  # Local SMTP sink with a web inbox at http://localhost:8025. Remove on a real
  # server and point SMTP_HOST at your relay instead.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
