# Fully self-hosted FasterFixes: dashboard + widget API, Postgres, MinIO for
# screenshots, and Mailpit as an SMTP sink for local testing.
#
#   cp .env.docker.example .env
#   docker compose up -d --build
#   open http://localhost:3000/login
#
# For a real server replace Mailpit with your SMTP relay (see .env) and put a
# reverse proxy with TLS in front of `web` (port 3000) and `minio` (port 9000),
# and set STORAGE_PUBLIC_ENDPOINT to MinIO's public https URL.

name: faster-fixes

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_FF_API_ORIGIN: ${BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_STORAGE_BASE_URL: ${NEXT_PUBLIC_STORAGE_BASE_URL:-http://localhost:9000/faster-fixes}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fasterfixes}:${POSTGRES_PASSWORD:-fasterfixes}@postgres:5432/${POSTGRES_DB:-fasterfixes}?schema=public
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://minio:9000
      # Presigned URLs are opened by browsers, so this must be the *public* MinIO URL.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-faster-fixes}
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      NEXT_PUBLIC_IS_CLOUD: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fasterfixes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fasterfixes}
      POSTGRES_DB: ${POSTGRES_DB:-fasterfixes}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fasterfixes} -d ${POSTGRES_DB:-fasterfixes}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Creates the bucket once. Screenshots are read through presigned URLs, so the
  # bucket stays private.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET_NAME:-faster-fixes} &&
      echo bucket ready"

  # Local SMTP sink with a web inbox at http://localhost:8025. Remove on a real
  # server and point SMTP_HOST at your relay instead.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
